name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test notification delivery contract
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio
          python -m pytest -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke-test the Linux image
        run: |
          docker build -t lumen-relay-smoke .
          docker run --rm --entrypoint python lumen-relay-smoke -c "import relay; from src.review_contract import ReviewCorrelator; assert relay.effective_mqtt_topic({'frigate': {'topic': 'frigate/events'}}) == ('frigate/reviews', True)"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lorislabapp/lumen-push-relay
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=review-confidence-20260920,enable=${{ github.ref_name == 'release/review-confidence-1.3.0' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
